---
Name: advancedworkflow-documentation
After:
  - '#cms-documentation'
---
# The CMS user documentation feature lives in the extracted module
# silverstripeltd/silverstripe-cms-documentation. Here we only point it at this
# module's user guide (docs/en/userguide) and scope the Docs button to the
# Workflows admin section. The feature stays disabled by default — enable it in
# your project config:
#
#   Silverstripe\CmsDocumentation\DocumentationService:
#     enabled: true
#
Silverstripe\CmsDocumentation\DocumentationService:
  module_name: 'symbiote/silverstripe-advancedworkflow'
  visible_paths:
    - 'admin/workflows'
